services:
  postgres:
    image: postgres:15-alpine
    container_name: plataforma_apps_postgres
    environment:
      POSTGRES_DB: plataforma_apps
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
